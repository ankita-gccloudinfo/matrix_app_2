<!DOCTYPE html>

    <style>
        body {
            background: linear-gradient(135deg, #003087, #0a192f);
            font-family: 'Anek Latin', sans-serif;

        .glass {
            background: rgba(255, 255, 255, 0.08);

            border-radius: 1rem;
        }

        .tab-active {
            background-color: #facc15;
            color: black !important;
        }

        .error-message {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Heading Style - Matches Your Matrix Design */
        .text-3xl {
            font-size: 2.0rem;
            font-weight: 700;
            text-align: center;
            margin: 0;
            padding: 0;
            /*background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);*/

            background-clip: text;
            /*letter-spacing: 3px;*/
            /*text-transform: uppercase;*/
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            }

        /* Alternative Style 1 - Neon Glow Effect */
        .matrix-heading-neon {
            font-size: 3.2rem;
            font-weight: 800;
            text-align: center;
            color: #fff;
            /*text-shadow: 0 0 10px rgb(251 251 251 / 80%), 0 0 20px rgb(255 255 255 / 60%), 0 0 30px rgb(255 255 255 / 40%);*/
            text-shadow: 0 0 10px rgb(0 0 0 / 80%), 0 0 20px rgb(255 255 255 / 67%), 0 0 30px rgb(255 255 255);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        @keyframes wave1 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-50px, 50px) scale(1.1);
            }
        }

        @keyframes wave2 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(50px, -50px) scale(1.15);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            max-width: 1400px;
            width: 100%;
        }

        .header-content {

        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 255, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.7),

<div id="recaptcha-container"></div>

<script>
    // =========================
    // ✅ Firebase Init
    // =========================
    const firebaseConfig = {
        apiKey: "AIzaSyCeNjlY6IftJtKCrhXA3Tesj5cisIaGdZ4",
        authDomain: "matrix-up.firebaseapp.com",
        projectId: "matrix-up",
        storageBucket: "matrix-up.firebasestorage.app",
        messagingSenderId: "961996546844",
        appId: "1:961996546844:web:476d74885bf9844fd710d9",
        measurementId: "G-WKTWCTBC78"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().languageCode = 'en'; // or 'hi'


    let pendingLogin = {username: "", password: ""};
    let emailVerified = false;
    let phoneVerified = false;
    let confirmationResult = null;
    let recaptchaVerifier = null;
    let otpCooldown = false;


    function openProfileModal() {
        document.getElementById('profileModal').classList.remove('hidden');
        // Modal khulte hi recaptcha ready karo
        initRecaptchaOnce();
    }

    function closeProfileModal() {
        document.getElementById('profileModal').classList.add('hidden');
    }

    function updateSaveButton() {
        const btn = document.getElementById("saveContinueBtn");
        // phoneVerified &&
        if (emailVerified) {
            btn.disabled = false;
            btn.classList.remove("opacity-60", "cursor-not-allowed");
        } else {
            btn.disabled = true;
            btn.classList.add("opacity-60", "cursor-not-allowed");
        }
    }


    // ✅ reCAPTCHA — SAHI TARIKA
    // =========================
    function initRecaptchaOnce() {
        if (recaptchaVerifier) return;

        recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", {
            size: "invisible",
            callback: (response) => {
                console.log("✅ reCAPTCHA solved");
            },
            'expired-callback': () => {
                // Agar expire ho jaye toh reset karo
                grecaptcha.reset();
            }
        });
    }

    function normalizeIndianPhone(phone) {
        const p = (phone || "").replace(/\s+/g, "");
        if (p.startsWith("+")) return p;
        if (p.length === 10) return "+91" + p;
        return p;
    }

    async function sendPhoneOtpFirebase() {
        if (otpCooldown) {
            alert("Please wait before requesting another OTP.");
            return;
        }

        let phone = document.getElementById("modalPhone").value.trim();
        // phone = normalizeIndianPhone(phone);
        if (!phone) return alert("Please enter your phone number.");

        // ✅ 60 second cooldown start
        otpCooldown = true;
        const btn = document.getElementById("sendPhoneOtpBtn");
        btn.disabled = true;
        let seconds = 60;
        btn.textContent = `Resend in 60s`;

        const timer = setInterval(() => {
            seconds--;
            btn.textContent = `Resend in ${seconds}s`;
            if (seconds <= 0) {
                clearInterval(timer);
                otpCooldown = false;
                btn.disabled = false;
                btn.textContent = "Get OTP";
            }
        }, 1000);

        openLoader();
        try {
            initRecaptchaOnce();
            const widgetId = await recaptchaVerifier.render();
            grecaptcha.reset(widgetId);

            confirmationResult = await firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier);
            alert("✅ OTP sent successfully!");

        } catch (e) {
            console.error("OTP Error:", e.code, e.message);
            if (recaptchaVerifier) {
                recaptchaVerifier.render().then(id => grecaptcha.reset(id));
            }
            if (e.code === 'auth/too-many-requests') {
                alert("❌ Too many requests. Please try again after some time.");
            } else {
                alert("❌ Error: " + e.message);
            }
        } finally {
            closeLoader();
        }
    }

    // =========================
    // ✅ Status API
    // =========================
    async function checkProfileStatus(username) {
        const url = `/api/user/profile/status?username=${encodeURIComponent(username)}`;
        const res = await fetch(url);
        const text = await res.text();
        if (!res.ok) throw new Error("Status API failed: " + res.status + " | " + text);
        return JSON.parse(text);
    }

    async function readErrorMessage(resp) {
        try {
            const data = await resp.json();
            return data.message || "Something went wrong. Please try again.";
        } catch {
            const text = await resp.text();
            return text || "Something went wrong. Please try again.";
        }
    }

    // =========================
    // ✅ Email OTP
    // =========================
    async function sendEmailOtp() {
        const email = document.getElementById("modalEmail").value.trim();
        if (!email) return alert("Please enter your email address");
        openLoader();
        try {
            const resp = await fetch("/api/user/profile/email/send-otp", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: pendingLogin.username, email})
            });
            if (!resp.ok) {
                const msg = await readErrorMessage(resp);

                // ✅ Friendly message for duplicate email
                if (resp.status === 400 && msg.toLowerCase().includes("already used")) {
                    return alert("❌ This email is already linked to another account. Please use a different email.");
                }

                throw new Error(msg);
            }
            alert("✅  Email OTP sent successfully!");
        } catch (e) {
            alert("❌Failed to send Email OTP: " + e.message);
        } finally {
            closeLoader();
        }
    }

    async function verifyEmailOtp() {
        const email = document.getElementById("modalEmail").value.trim();
        const otp = document.getElementById("emailOtp").value.trim();
        if (!email || !otp) return alert("Please enter both email and OTP.");
        openLoader();
        try {
            const resp = await fetch("/api/user/profile/email/verify-otp", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: pendingLogin.username, email, otp})
            });
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            if (data.verified === true) {
                emailVerified = true;
                document.getElementById("emailVerifiedText").classList.remove("hidden");
                alert("✅ Email verified!");
            } else {
                alert("❌ Invalid OTP");
            }
            updateSaveButton();
        } catch (e) {
            alert("❌ Email verify failed: " + e.message);
        } finally {
            closeLoader();
        }
    }

    // =========================
    // ✅ Complete Profile
    // =========================
    async function completeProfileAndLogin() {
        const fullName = document.getElementById("modalFullName").value.trim();
        const email = document.getElementById("modalEmail").value.trim();
        let phone = document.getElementById("modalPhone").value.trim();

        if (!fullName) return alert("Full Name is required.");
        if (!emailVerified) return alert("Please verify Email first");

        // phone = normalizeIndianPhone(phone);
        openLoader();
        try {
            const resp = await fetch("/api/user/profile/complete", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: pendingLogin.username, fullName, email})
            });
            if (!resp.ok) throw new Error(await resp.text());
            closeProfileModal();

        } catch (e) {

    // =========================
    // ✅ Login Form Submit (UPDATED WITH reCAPTCHA)
    // =========================
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        // 1. Determine final username based on Main/Sub toggle
        let username = "";
        const loginType = document.querySelector('input[name="loginType"]:checked')?.value || 'Main';

        if (loginType === 'Sub') {
            username = (document.getElementById('subUserNameDropdown').value || "").trim();
        } else {
            username = (document.getElementById('userNameDropdown').value || "").trim();
        }

        const password = (document.getElementById('passwordInput').value || "").trim();

        if (!username || !password) {
            alert('Please select a username and enter your password');
            return;
        }

        // Set the hidden input so the backend receives the correct username upon final submission!
        document.getElementById('finalUsernameToSubmit').value = username;

        pendingLogin.username = username;
        pendingLogin.password = password;

        emailVerified = false;
        phoneVerified = false;
        confirmationResult = null;

        document.getElementById("emailVerifiedText").classList.add("hidden");
        document.getElementById("phoneVerifiedText").classList.add("hidden");
        updateSaveButton();

        openLoader();

        try {
            const status = await checkProfileStatus(username);

            // =========================
            // 🔹 IF PROFILE COMPLETE → generate reCAPTCHA and submit
            // =========================
            if (status.profileCompleted === true) {

                grecaptcha.ready(function () {
                    grecaptcha.execute('6LcGC3csAAAAAIQUk813Cym2CfnTb7guOiJF22yI', {action: 'login'})
                        .then(function (token) {

                            document.getElementById('recaptchaToken').value = token;

                            closeLoader();

                            // Final submit to backend
                            document.getElementById("loginForm").submit();
                        })
                        .catch(function (error) {
                            closeLoader();
                            console.error("reCAPTCHA error:", error);
                            alert("reCAPTCHA failed. Please try again.");
                        });
                });

                return;
            }

            // =========================
            // 🔹 IF PROFILE NOT COMPLETE → open modal (unchanged logic)
            // =========================
            closeLoader();

            openProfileModal();

            document.getElementById("modalFullName").value = status.fullName || "";
            document.getElementById("modalEmail").value = status.email || "";
            document.getElementById("modalPhone").value = (status.phone || "").replace("+91", "");

            if (status.emailVerified === true) {
                emailVerified = true;
                document.getElementById("emailVerifiedText").classList.remove("hidden");
            }

            if (status.phoneVerified === true) {
                phoneVerified = true;
                document.getElementById("phoneVerifiedText").classList.remove("hidden");
            }

            updateSaveButton();

        } catch (err) {
            console.error(err);
            closeLoader();
            alert("Could not verify profile status. Please contact admin.");
        }
    });

    function onMainUserSelect() {
        // Show the Main/Sub choice when a user selects a primary username
        document.getElementById('mainSubSelection').classList.remove('hidden');

        // Reset to "Main" by default when they switch names
        document.querySelector('input[name="loginType"][value="Main"]').checked = true;
        onLoginTypeChange();
    }

    async function onLoginTypeChange() {
        const loginType = document.querySelector('input[name="loginType"]:checked').value;
        const subUserContainer = document.getElementById('subUserContainer');
        const subUserDropdown = document.getElementById('subUserNameDropdown');
        const mainDropdown = document.getElementById('userNameDropdown');

        // Get the selected option element
        const selectedOption = mainDropdown.options[mainDropdown.selectedIndex];
        const mainUsername = selectedOption.value;

        // GET THE ROLE FROM THE DATA ATTRIBUTE
        const mainRole = selectedOption.getAttribute('data-role');

        if (loginType === 'Main') {
            // Hide sub-user dropdown and remove requirement
            subUserContainer.classList.add('hidden');
            subUserDropdown.removeAttribute('required');
        } else if (loginType === 'Sub' && mainUsername) {
            // Show sub-user dropdown and make it required
            subUserContainer.classList.remove('hidden');
            subUserDropdown.setAttribute('required', 'true');

            openLoader();
            try {
                // PASS THE ROLE INSTEAD OF THE USERNAME to the Sub User API
                const response = await fetch(`/api/data/subUsertype?userType=${encodeURIComponent(mainRole)}`);
                if (!response.ok) throw new Error('Failed to fetch sub users');

                const subUsernames = await response.json();

                subUserDropdown.innerHTML = '<option value="" selected disabled>Select Sub Username</option>';
                subUsernames.forEach(uname => {
                    const option = document.createElement('option');
                    option.value = uname;
                    option.textContent = uname;
                    subUserDropdown.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching sub usernames:', error);
                alert('Could not load Sub Users. Please try again.');
            } finally {
                closeLoader();
            }
        }
    }

</script>

    async function fetchUsernames(role, userType) {
        openLoader();
        try {
            // Reset Main/Sub UI when switching tabs
            document.getElementById('mainSubSelection').classList.add('hidden');
            document.getElementById('subUserContainer').classList.add('hidden');
            document.getElementById('subUserNameDropdown').removeAttribute('required');

            const response = await fetch(`/api/data/usertype?userType=${userType}`);
            if (!response.ok) throw new Error('Network response was not ok');

            // This is now an array of Maps: [{username: "...", role: "..."}, ...]
            const userData = await response.json();

            // 🛑 NEW CODE: Array of usernames to hide (in lowercase for safety)
            const hiddenUsernames = ['dev_smc', 'dev_lucknow', 'dev_agra_range', 'dev_agra_zone'];

            // Filter out the specific usernames
            const filteredUsers = userData.filter(userObj => {
                const uName = (userObj.username || userObj.USERNAME || "").toLowerCase();
                // Return true ONLY if the username is NOT in the hiddenUsernames array
                return !hiddenUsernames.includes(uName);
            });

            // Sort usernames using the object's username property on the FILTERED array
            const sortedUsers = filteredUsers.sort((a, b) => {
                // Note: Depending on your DB driver, Map keys might be uppercase (USERNAME).
                // We use || to safely handle both 'username' and 'USERNAME' just in case.
                const nameA = (a.username || a.USERNAME || "").toLowerCase();
                const nameB = (b.username || b.USERNAME || "").toLowerCase();

                // ... rest of your sorting logic ...

                if (userType === 'HeadQuarter') {
                    if (nameA === 'dgp') return -1;
                    if (nameB === 'dgp') return 1;
                }
                const aStarts = nameA.startsWith("ssp");
                const bStarts = nameB.startsWith("ssp");
                if (aStarts !== bStarts) return aStarts ? -1 : 1;
                return nameA.localeCompare(nameB, undefined, {sensitivity: "base"});
            });

            // Populate dropdown
            const dropdown = document.getElementById('userNameDropdown');
            dropdown.innerHTML = '<option value="" selected disabled>Select Username</option>';

            sortedUsers.forEach(userObj => {
                const uName = userObj.username || userObj.USERNAME;
                const uRole = userObj.role || userObj.ROLE;

                const option = document.createElement('option');
                option.value = uName;
                option.textContent = uName;

                // STORE THE ROLE in a custom data attribute on the option
                option.setAttribute('data-role', uRole || '');

                dropdown.appendChild(option);
            });

            // Update active tab
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('tab-active'));
            document.querySelector(`[data-tab="${role}"]`).classList.add('tab-active');

            closeLoader();
        } catch (error) {
            console.error('Error fetching usernames:', error);
            alert('Something went wrong, please contact admin');
            closeLoader();
        }
    }

    // Initialize dropdown with DGP usernames on page load
    window.addEventListener('DOMContentLoaded', function () {
        fetchUsernames('dgp', 'HeadQuarter');
    });
